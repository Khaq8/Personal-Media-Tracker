<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Movie/TV show Collection</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="container">
        <header>
            <a href="#" class="logo">Movie<span>TV</span></a>
            <a href="collection.html" class="logo">Go To <span>Collection</span></a>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <div class="search-container">
            <div class="search-element">
                
                <div class="search-wrapper">
                    <h3>Search A Movie or TV-Show:</h3>
                    <input type="text" class="form-control" placeholder="Search Movie Title ..." id="movie-search-box"
                        onkeyup="findMovies()" onclick="findMovies()">
                    <div class="search-list" id="search-list">
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="result-container">
                <div class="result-grid-search" id="result-grid">

                </div>
            </div>
        </div>

    </section>

    <footer>
        <p>&copy; </p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
